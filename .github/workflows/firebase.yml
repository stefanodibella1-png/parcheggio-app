name: Firebase (regole + configurazione + aggiornamento app)
# attivazione: secret FIREBASE_SERVICE_ACCOUNT aggiunto l'08/10

# Parte da solo ogni 15 minuti finché la community non è configurata:
# appena il secret FIREBASE_SERVICE_ACCOUNT esiste, pubblica le regole,
# scrive la configurazione nell'app e invia l'aggiornamento ai telefoni.
on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - '.github/workflows/firebase.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: firebase
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  firebase:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Serve fare qualcosa?
        id: gate
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "::notice title=Firebase::in attesa del secret FIREBASE_SERVICE_ACCOUNT"
            echo "go=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${{ github.event_name }}" = "schedule" ] && ! grep -q '} | null = null;' src/community/firebaseConfig.ts; then
            echo "::notice title=Firebase::già configurato"
            echo "go=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "go=yes" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        if: steps.gate.outputs.go == 'yes'
        with:
          node-version: 22

      - name: Credenziali
        if: steps.gate.outputs.go == 'yes'
        run: |
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          PID=$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).project_id)" "$RUNNER_TEMP/sa.json")
          echo "PROJECT_ID=$PID" >> "$GITHUB_ENV"
          echo "::notice title=Firebase progetto::$PID"
          npm install -g firebase-tools@14 --no-audit --no-fund

      - name: Database Firestore (crea se manca)
        if: steps.gate.outputs.go == 'yes'
        run: |
          if firebase firestore:databases:list --project "$PROJECT_ID" --json 2>/dev/null | grep -q '(default)'; then
            echo "::notice title=Firestore::database presente"
          else
            firebase firestore:databases:create '(default)' --location eur3 --project "$PROJECT_ID" --non-interactive \
              && echo "::notice title=Firestore::database creato" \
              || echo "::warning title=Firestore::non riesco a creare il database: crealo dalla console"
          fi

      - name: Pubblica le regole
        if: steps.gate.outputs.go == 'yes'
        run: |
          set -o pipefail
          firebase deploy --only firestore:rules --project "$PROJECT_ID" --non-interactive 2>&1 | tee rules.log
          echo "::notice title=Firestore regole::pubblicate"

      - name: Configurazione app web
        if: steps.gate.outputs.go == 'yes'
        run: |
          set -o pipefail
          list() { firebase apps:list WEB --project "$PROJECT_ID" --json 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const r=JSON.parse(s).result||[];console.log(r[0]?r[0].appId:'')}catch{console.log('')}})"; }
          APP=$(list)
          if [ -z "$APP" ]; then firebase apps:create WEB parcheggio --project "$PROJECT_ID" --non-interactive 2>&1 | tee -a rules.log || true; APP=$(list); fi
          if [ -z "$APP" ]; then echo "::error title=Firebase app::nessuna app web: registrala dalla console (icona </>)"; exit 1; fi
          firebase apps:sdkconfig WEB "$APP" --project "$PROJECT_ID" --json > sdk.json
          node -e "
            const r=JSON.parse(require('fs').readFileSync('sdk.json','utf8')).result;
            const c=r.sdkConfig||JSON.parse(r.fileContents.match(/\{[\s\S]*\}/)[0]);
            const cfg={apiKey:c.apiKey,authDomain:c.authDomain,projectId:c.projectId,storageBucket:c.storageBucket,messagingSenderId:c.messagingSenderId,appId:c.appId};
            const head='// Configurazione Firebase del progetto PARCHEGGIO (Firestore).\n// Scritta in automatico da .github/workflows/firebase.yml. Valori pubblici:\n// la protezione dei dati è affidata alle regole in firestore.rules.\n';
            const body='export const FIREBASE_CONFIG: {\n  apiKey: string;\n  authDomain: string;\n  projectId: string;\n  storageBucket?: string;\n  messagingSenderId?: string;\n  appId: string;\n} | null = '+JSON.stringify(cfg,null,2)+';\n';
            require('fs').writeFileSync('src/community/firebaseConfig.ts',head+body);
            console.log('::notice title=FIREBASE_CONFIG::'+JSON.stringify(cfg));
          "

      - name: Salva la configurazione nel repository
        if: steps.gate.outputs.go == 'yes'
        id: commit
        run: |
          if git diff --quiet -- src/community/firebaseConfig.ts; then echo "changed=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "parcheggio-bot"
          git config user.email "parcheggio-bot@users.noreply.github.com"
          git add src/community/firebaseConfig.ts
          git commit -m "Community attiva: configurazione Firebase"
          git push
          echo "changed=yes" >> "$GITHUB_OUTPUT"

      - name: Aggiornamento ai telefoni
        if: steps.gate.outputs.go == 'yes' && steps.commit.outputs.changed == 'yes'
        run: |
          set -o pipefail
          npm install --no-audit --no-fund
          npx expo install --fix
          npm run test:engine
          RV=$(tr -d '[:space:]' < runtime-android.txt)
          node -e "const f='app.json';const j=require('./'+f);j.expo.runtimeVersion=process.argv[1];j.expo.owner='stefanodibella1s-organization';require('fs').writeFileSync(f,JSON.stringify(j,null,2))" "$RV"
          npx eas-cli@latest update --channel preview --platform android --non-interactive --message "Community attiva" 2>&1 | tee -a rules.log
          echo "::notice title=App::aggiornamento con la community inviato ai telefoni"

      - name: Riassunto errori (se fallisce)
        if: failure()
        run: |
          [ -f rules.log ] || exit 0
          body=$(tail -30 rules.log | sed 's/\x1b\[[0-9;]*m//g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Firebase::$body"
