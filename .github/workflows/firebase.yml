name: Firebase (regole + configurazione)

on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - '.github/workflows/firebase.yml'
  workflow_dispatch:

jobs:
  firebase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Chiave presente?
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "::error title=Firebase::Manca il secret FIREBASE_SERVICE_ACCOUNT nel repository"; exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Credenziali
        run: |
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          PID=$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).project_id)" "$RUNNER_TEMP/sa.json")
          echo "PROJECT_ID=$PID" >> "$GITHUB_ENV"
          echo "::notice title=Firebase progetto::$PID"

      - name: Strumenti
        run: npm install -g firebase-tools@14 --no-audit --no-fund

      - name: Database Firestore (crea se manca)
        run: |
          if firebase firestore:databases:list --project "$PROJECT_ID" --json 2>/dev/null | grep -q '(default)'; then
            echo "::notice title=Firestore::database già presente"
          else
            firebase firestore:databases:create '(default)' --location eur3 --project "$PROJECT_ID" --non-interactive \
              && echo "::notice title=Firestore::database creato (eur3)" \
              || echo "::warning title=Firestore::creazione database non riuscita (crealo dalla console)"
          fi

      - name: Pubblica le regole
        run: |
          set -o pipefail
          firebase deploy --only firestore:rules --project "$PROJECT_ID" --non-interactive 2>&1 | tee rules.log
          echo "::notice title=Firestore regole::pubblicate"

      - name: Configurazione app web
        run: |
          APP=$(firebase apps:list WEB --project "$PROJECT_ID" --json 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const r=JSON.parse(s).result||[];console.log(r[0]?r[0].appId:'')}catch{console.log('')}})")
          if [ -z "$APP" ]; then
            firebase apps:create WEB parcheggio --project "$PROJECT_ID" --non-interactive || true
            APP=$(firebase apps:list WEB --project "$PROJECT_ID" --json 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const r=JSON.parse(s).result||[];console.log(r[0]?r[0].appId:'')}catch{console.log('')}})")
          fi
          if [ -z "$APP" ]; then echo "::error title=Firebase app::impossibile creare/leggere l'app web"; exit 1; fi
          CFG=$(firebase apps:sdkconfig WEB "$APP" --project "$PROJECT_ID" --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const r=JSON.parse(s).result;const c=r.sdkConfig||r.fileContents&&JSON.parse(r.fileContents.match(/\{[\s\S]*\}/)[0]);console.log(JSON.stringify({apiKey:c.apiKey,authDomain:c.authDomain,projectId:c.projectId,storageBucket:c.storageBucket,messagingSenderId:c.messagingSenderId,appId:c.appId}))})")
          # valori pubblici (identificano il progetto, non sono segreti)
          echo "::notice title=FIREBASE_CONFIG::$CFG"

      - name: Riassunto errori (se fallisce)
        if: failure()
        run: |
          [ -f rules.log ] || exit 0
          body=$(tail -30 rules.log | sed 's/\x1b\[[0-9;]*m//g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Firebase::$body"
