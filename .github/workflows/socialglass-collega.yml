# Cifra la chiave Firebase di questo repo con la chiave pubblica di SocialGlass (la privata è solo su Vercel)
# e la consegna come artefatto temporaneo (1 giorno). SocialGlass la decifra e la imposta su Vercel.
name: socialglass-collega
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/socialglass-collega.yml"]
jobs:
  cifra:
    runs-on: ubuntu-latest
    env:
      SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      PUB: ""
    steps:
      - name: Cifra
        run: |
          set -e
          [ -n "$SA" ] || { echo "::error::FIREBASE_SERVICE_ACCOUNT assente"; exit 1; }
          mkdir out; echo "$PUB" | base64 -d > pub.pem
          openssl rand -hex 32 | tr -d '\n' > k
          printf '%s' "$SA" | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass file:k -out out/sa.enc
          openssl pkeyutl -encrypt -pubin -inkey pub.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in k -out out/k.bin
          rm -f k; echo "::notice title=SocialGlass::chiave cifrata pronta (run ${{ github.run_id }})"
      - uses: actions/upload-artifact@v4
        with: { name: sg-sa, path: out/, retention-days: 1 }
