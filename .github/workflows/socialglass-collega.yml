# Pulizia: rimuove dal Firestore del parcheggio i dati di prova di SocialGlass (raccolte sg_*). Poi questo file va eliminato.
name: socialglass-pulizia
on:
  push:
    branches: [main]
    paths: [".github/workflows/socialglass-collega.yml"]
jobs:
  pulisci:
    runs-on: ubuntu-latest
    env:
      SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"; export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          P=$(node -p "JSON.parse(require('fs').readFileSync('$RUNNER_TEMP/sa.json','utf8')).project_id")
          npm i -g firebase-tools@14 --no-audit --no-fund >/dev/null
          for c in sg_caf sg_ottici_login sg_ottici sg_utenti sg_montature sg_meta; do firebase firestore:delete "$c" --recursive --force --project "$P" >/dev/null 2>&1 && echo "rimossa $c"; done
          rm -f "$RUNNER_TEMP/sa.json"
          echo "::notice title=Pulizia::dati SocialGlass rimossi da $P"
