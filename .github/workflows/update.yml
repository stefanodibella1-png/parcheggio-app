name: Aggiornamento automatico (EAS Update)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update.yml'
      - 'engine/**'
      - 'src/**'
      - 'App.tsx'
      - 'index.ts'
  workflow_dispatch:

concurrency:
  group: eas-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Token presente?
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Manca il secret EXPO_TOKEN nel repository"; exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Dipendenze (identiche alla build APK)
        run: |
          npm install --no-audit --no-fund
          npx expo install --fix

      - name: Test del motore
        run: npm run test:engine

      - name: Genera progetto Android (come nella build APK, serve allo stesso runtime)
        run: npx expo prebuild --platform android --no-install --clean

      - name: Runtime identico all'APK installata
        run: |
          RV=$(npx expo-updates runtimeversion:resolve --platform android 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).runtimeVersion||'')}catch{console.log('')}})")
          if [ -z "$RV" ]; then RV=$(npx expo-updates fingerprint:generate --platform android | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).hash))"); fi
          echo "::notice::runtimeVersion $RV"
          node -e "const f='app.json';const j=require('./'+f);j.expo.runtimeVersion=process.argv[1];j.expo.owner='stefanodibella1s-organization';require('fs').writeFileSync(f,JSON.stringify(j,null,2))" "$RV"

      - name: Pubblica aggiornamento
        run: |
          set -o pipefail
          npx eas-cli@latest update --channel preview --platform android --non-interactive --message "${{ github.event.head_commit.message || 'aggiornamento manuale' }}" 2>&1 | tee update.log

      - name: Riassunto errori (se fallisce)
        if: failure()
        run: |
          body=$(tail -40 update.log | sed 's/\x1b\[[0-9;]*m//g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=EAS Update::$body"
