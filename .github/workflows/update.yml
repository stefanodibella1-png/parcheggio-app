name: Aggiornamento automatico (EAS Update)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update.yml'
      - 'runtime-android.txt'
      - 'engine/**'
      - 'src/**'
      - 'App.tsx'
      - 'index.ts'
      - 'app.config.js'
  workflow_dispatch:

concurrency:
  group: eas-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Token presente?
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Manca il secret EXPO_TOKEN nel repository"; exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Dipendenze (identiche alla build APK)
        run: |
          npm install --no-audit --no-fund
          npx expo install --fix

      - name: Test del motore
        run: npm run test:engine

      - name: Controllo TypeScript (blocca l'aggiornamento se ci sono errori)
        run: |
          if ! npx tsc --noEmit > tsc.log 2>&1; then
            head -30 tsc.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

      - name: Prova bundle JavaScript (blocca l'aggiornamento se non compila)
        run: |
          set -o pipefail
          npx expo export --platform android --output-dir /tmp/bundle-check > bundle.log 2>&1 || { grep -iE "error|unable" bundle.log | head -20 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }

      - name: Runtime identico all'APK installata
        run: |
          # runtime-android.txt viene scritto dalla build APK leggendo l'APK stessa
          RV=$(tr -d '[:space:]' < runtime-android.txt)
          echo "::notice::runtimeVersion $RV"
          node -e "const f='app.json';const j=require('./'+f);j.expo.runtimeVersion=process.argv[1];j.expo.owner='stefanodibella1s-organization';require('fs').writeFileSync(f,JSON.stringify(j,null,2))" "$RV"

      - name: Pubblica aggiornamento
        run: |
          set -o pipefail
          MSG="${{ github.event.head_commit.message || 'aggiornamento manuale' }}"
          MSG="${MSG%%$'\n'*}"
          # data/ora e nota delle modifiche, mostrate nell'app
          node -e "require('fs').writeFileSync('src/releaseNote.ts', '// Scritto in automatico da .github/workflows/update.yml a ogni aggiornamento.\nexport const RELEASE: { at: number; note: string } = ' + JSON.stringify({ at: Date.now(), note: process.argv[1] }) + ';\n')" "$MSG"
          npx eas-cli@latest update --channel preview --platform android --non-interactive --message "$MSG" 2>&1 | tee update.log
          APP_VARIANT=public npx eas-cli@latest update --channel public --platform android --non-interactive --message "$MSG" 2>&1 | tee -a update.log

      - name: Riassunto errori (se fallisce)
        if: failure()
        run: |
          body=$(tail -40 update.log | sed 's/\x1b\[[0-9;]*m//g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=EAS Update::$body"
