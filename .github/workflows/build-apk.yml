name: Build APK Android

on:
  push:
    branches: [main]
    paths:
      - 'app.json'
      - 'package.json'
      - 'modules/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Dipendenze
        run: |
          npm install --no-audit --no-fund
          npx expo install --fix

      - name: Test del motore
        run: npm run test:engine

      - name: Controllo TypeScript (informativo)
        run: npx tsc --noEmit || echo "::warning::TypeScript ha segnalato errori"

      - name: Prova bundle JavaScript
        run: |
          set -o pipefail
          npx expo export --platform android --output-dir /tmp/bundle-check 2>&1 | tee bundle.log

      - name: Riassunto errori bundle (se fallisce)
        if: failure()
        run: |
          body=$(grep -n -A25 -iE "error|unable to resolve|SyntaxError" bundle.log | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Bundle::$body"

      - name: Genera progetto Android
        run: npx expo prebuild --platform android --no-install --clean

      - name: Runtime di questa APK
        run: |
          RV=$(npx expo-updates runtimeversion:resolve --platform android 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).runtimeVersion||'')}catch{console.log('')}})")
          echo "::notice::runtimeVersion $RV"

      - name: Verifica modulo nativo
        run: |
          if grep -rq "activity-recognition\|activityrecognition" android/settings.gradle android/app/build/generated 2>/dev/null || npx expo-modules-autolinking resolve --platform android 2>/dev/null | grep -qi "activity-recognition\|activityrecognition"; then
            echo "::notice::Modulo activity-recognition incluso"
          else
            echo "::error::Modulo activity-recognition NON trovato dall'autolinking"; exit 1
          fi

      - name: Compila APK
        working-directory: android
        run: |
          set -o pipefail
          sed -i '/^org.gradle.jvmargs=/d;/^kotlin.daemon.jvmargs=/d' gradle.properties
          echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties
          echo "kotlin.daemon.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g" >> gradle.properties
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a 2>&1 | tee ../gradle.log

      - name: Riassunto errori (se fallisce)
        if: failure()
        run: |
          grep -nE "^e: |error:|ERROR|What went wrong|FAILURE|Could not|Unresolved|> " gradle.log | grep -v "^.*> Task" | head -40 > errors.txt || true
          i=0
          while IFS= read -r line && [ $i -lt 9 ]; do echo "::error::$line"; i=$((i+1)); done < errors.txt
          body=$(sed -n '/What went wrong/,/Try:/p' gradle.log | head -30 | sed ':a;N;$!ba;s/\n/%0A/g')
          [ -n "$body" ] && echo "::error title=Gradle::$body" || true

      - name: Rinomina APK
        run: cp android/app/build/outputs/apk/release/app-release.apk PARCHEGGIO-build-${{ github.run_number }}.apk

      - name: Pubblica la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PARCHEGGIO build ${{ github.run_number }}
          body: APK Android compilata da GitHub Actions dal commit ${{ github.sha }}.
          files: PARCHEGGIO-build-${{ github.run_number }}.apk
          make_latest: true
